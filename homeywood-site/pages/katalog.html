<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="katalog">

<section class="page active" id="page-katalog">
  <div class="container section">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="search" id="katalogSearch" placeholder="Cari produk, misalnya sofa jati..." autocomplete="off">
    </div>
    <div class="catalog-layout">
      <aside class="filters">
        <h4>Filter Produk</h4>
        <div class="fgroup">
          <label><input type="radio" name="fcat" value="Semua" checked onchange="renderKatalog()"> Semua</label>
          <label><input type="radio" name="fcat" value="Sofa" onchange="renderKatalog()"> Sofa</label>
          <label><input type="radio" name="fcat" value="Meja" onchange="renderKatalog()"> Meja</label>
          <label><input type="radio" name="fcat" value="Kursi" onchange="renderKatalog()"> Kursi</label>
          <label><input type="radio" name="fcat" value="Lemari" onchange="renderKatalog()"> Lemari</label>
        </div>
        <div class="fgroup">
          <h4>Material</h4>
          <label><input type="checkbox" class="fmat" value="Kayu Jati" onchange="renderKatalog()"> Kayu Jati</label>
          <label><input type="checkbox" class="fmat" value="Kayu Mahoni" onchange="renderKatalog()"> Kayu Mahoni</label>
          <label><input type="checkbox" class="fmat" value="Rotan" onchange="renderKatalog()"> Rotan</label>
        </div>
      </aside>
      <div style="flex:1">
        <div class="grid cols-3" id="katalogGrid"></div>
      </div>
    </div>
  </div>
  <div id="footer-katalog"></div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
<script>
(function(){
  var input=document.getElementById("katalogSearch"), grid=document.getElementById("katalogGrid");
  function apply(){
    var q=input.value.trim().toLowerCase(), shown=0;
    grid.querySelectorAll(".pcard").forEach(function(c){
      var n=(c.querySelector(".name")||c).textContent.toLowerCase();
      var hit=!q||n.indexOf(q)>-1;
      c.style.display=hit?"":"none";
      if(hit) shown++;
    });
    var msg=document.getElementById("noResult");
    if(q && grid.querySelector(".pcard") && !shown){
      if(!msg){
        msg=document.createElement("div");
        msg.id="noResult"; msg.className="empty-state"; msg.style.gridColumn="1/-1";
        grid.appendChild(msg);
      }
      msg.innerHTML="<div>🔍</div>";
      msg.appendChild(document.createTextNode('Produk "'+input.value.trim()+'" tidak ditemukan.'));
    } else if(msg){ msg.remove(); }
  }
  input.addEventListener("input",apply);
  new MutationObserver(apply).observe(grid,{childList:true});
})();
</script>
</body>
</html>
