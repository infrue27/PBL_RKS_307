<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="katalog">

<section class="page active" id="page-katalog">
  <div class="container section">
    <div class="catalog-layout">
      <aside class="filters">
        <h4>Filter Produk</h4>
        <div class="fgroup">
          <label><input type="radio" name="fcat" value="Semua" checked onchange="renderKatalog()"> Semua</label>
          <label><input type="radio" name="fcat" value="Sofa" onchange="renderKatalog()"> Sofa</label>
          <label><input type="radio" name="fcat" value="Meja" onchange="renderKatalog()"> Meja</label>
          <label><input type="radio" name="fcat" value="Kursi" onchange="renderKatalog()"> Kursi</label>
          <label><input type="radio" name="fcat" value="Lemari" onchange="renderKatalog()"> Lemari</label>
        </div>
        <div class="fgroup">
          <h4>Material</h4>
          <label><input type="checkbox" class="fmat" value="Kayu Jati" onchange="renderKatalog()"> Kayu Jati</label>
          <label><input type="checkbox" class="fmat" value="Kayu Mahoni" onchange="renderKatalog()"> Kayu Mahoni</label>
          <label><input type="checkbox" class="fmat" value="Rotan" onchange="renderKatalog()"> Rotan</label>
        </div>
      </aside>
      <div style="flex:1">
        <div class="grid cols-3" id="katalogGrid"></div>
      </div>
    </div>
  </div>
  <div id="footer-katalog"></div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
