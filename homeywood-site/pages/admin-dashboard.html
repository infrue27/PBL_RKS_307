<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<html lang="id"><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0;url=home.html"><title>Homey Wood</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>"></head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin-dashboard">

<section class="page active" id="page-admin-dashboard">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar1"></aside>
    <div class="admin-content">
    <div class="admin-header" id="adminHeader1"></div>
      <main class="admin-main">
                <div class="report-bar">
          <div class="report-dates">
            <label>Dari <input type="date" id="repFrom"></label>
            <label>Sampai <input type="date" id="repTo"></label>
            <button class="btn btn-primary btn-sm" onclick="loadReport()">Terapkan</button>
          </div>
          <div class="report-export">
            <button class="btn btn-outline btn-sm" onclick="exportReport('pdf')">📄 Export PDF</button>
            <button class="btn btn-outline btn-sm" onclick="exportReport('xlsx')">📊 Export Excel</button>
          </div>
        </div>
        <div class="kpi-grid kpi-donuts" id="kpiDonuts"></div>
        <div class="kpi-grid" id="kpiGrid" style="display:none"></div>
        <h3>Rekap Penjualan per Kategori <span class="muted" id="repPeriod" style="font-weight:400;font-size:12px;font-family:'Inter',sans-serif"></span></h3>
        <div class="table-wrap" style="margin-bottom:24px"><table id="repTable"><thead><tr><th>Kategori</th><th>Terjual (unit)</th><th>Transaksi</th><th>Pendapatan</th></tr></thead><tbody></tbody></table></div>
        <h3>Transaksi Terbaru</h3>
        <div class="table-wrap"><table id="adminRecentTable"><thead><tr><th>ID Pesanan</th><th>Pelanggan</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div>
      </main>
      <div id="footer-admin-dashboard"></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
<script src="../js/laporan.js"></script>
</body>
</html>
