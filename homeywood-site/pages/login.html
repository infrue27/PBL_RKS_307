<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">

<section class="page active" id="page-login">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-side" style="background-image:url('https://images.unsplash.com/photo-1680965585463-386646047473?fm=jpg&amp;q=70&amp;w=900&amp;auto=format&amp;fit=crop')">
        <div class="auth-eyebrow">Ruang yang terasa seperti rumah</div>
        <h2>Kembali ke kehangatan<br>Homey Wood.</h2>
        <p>Masuk untuk melanjutkan koleksi favorit, pesanan, dan inspirasi ruang Anda.</p>
      </div>
      <div class="auth-form">
        <h2>Selamat Datang!</h2>
        <p class="form-sub">Masuk ke akun Anda untuk pengalaman belanja yang lebih personal.</p>
        <div class="form-row">
          <label>Email</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><input type="email" id="loginEmail" placeholder="nama@email.com"></div>
        </div>
        <div class="form-row">
          <label>Password</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="loginPass" placeholder="Masukkan Kata Sandi"></div>
        </div>
        <div class="auth-toprow">
          <label class="check-row" style="margin-bottom:0"><input type="checkbox" id="loginRemember"> Ingat saya</label>
          <a onclick="go('lupa-password')">Lupa kata sandi?</a>
        </div>
        <button class="btn btn-primary btn-block" onclick="doLogin()">Masuk</button>
        <p class="switch-link">Belum punya akun? <a onclick="go('register')">Daftar sekarang</a></p>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
