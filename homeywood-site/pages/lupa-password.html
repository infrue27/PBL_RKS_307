<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="lupa-password">

<section class="page active" id="page-lupa-password">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-side" style="background-image:url('https://images.unsplash.com/photo-1680965585463-386646047473?fm=jpg&amp;q=70&amp;w=900&amp;auto=format&amp;fit=crop')">
        <div class="auth-eyebrow">Ruang yang terasa seperti rumah</div>
        <h2>Lupa kata sandi?<br>Tenang saja.</h2>
        <p>Masukkan email akun Anda, kami kirimkan link untuk membuat kata sandi baru.</p>
      </div>
      <div class="auth-form">
        <h2>Lupa Kata Sandi</h2>
        <p class="form-sub">Link reset akan dikirim ke email Anda dan berlaku selama 30 menit.</p>
        <div class="form-row">
          <label>Email</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><input type="email" id="forgotEmail" placeholder="nama@email.com"></div>
        </div>
        <button class="btn btn-primary btn-block" id="forgotBtn" onclick="doForgotPassword()">Kirim Link Reset</button>
        <p class="switch-link">Ingat kata sandi? <a onclick="go('login')">Kembali masuk</a></p>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
