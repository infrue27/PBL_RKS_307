<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin-katalog">

<section class="page active" id="page-admin-katalog">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar2"></aside>
    <div class="admin-content">
      <div class="admin-header" id="adminHeader2"></div>
      <main class="admin-main">
        <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
          <button class="btn btn-primary btn-sm" onclick="showAddProductForm()">+ Tambah Produk</button>
        </div>
        <div class="card" id="addProductForm" style="display:none;margin-bottom:20px">
          <div class="two-col">
            <div class="form-row"><label>Nama Produk</label><input id="apName"></div>
            <div class="form-row"><label>Kategori</label>
              <select id="apCat"><option>Sofa</option><option>Meja</option><option>Kursi</option><option>Lemari</option></select>
            </div>
            <div class="form-row"><label>Bahan / Material</label>
              <select id="apMat"><option>Kayu Jati</option><option>Kayu Mahoni</option><option>Rotan</option></select>
            </div>
            <div class="form-row"><label>Harga (Rp)</label><input id="apPrice" type="number"></div>
            <div class="form-row"><label>Stok</label><input id="apStock" type="number"></div>
          </div>
          <div class="form-row"><label>Deskripsi</label><textarea id="apDesc" rows="2"></textarea></div>
          <div class="form-row"><label>Foto Produk (JPG/PNG/WEBP, maks 2 MB)</label>
            <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
              <div id="apImagePreview" class="img-preview"></div>
              <input id="apImage" type="file" accept="image/jpeg,image/png,image/webp" onchange="onProductImagePick(this)">
              <button type="button" id="apImageRemove" class="btn btn-outline btn-sm" style="display:none" onclick="clearProductImage()">Hapus Foto</button>
            </div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveProduct()">Simpan Produk</button>
          <button class="btn btn-outline btn-sm" onclick="hideAddProductForm()">Batal</button>
        </div>
        <div class="table-wrap"><table id="adminProductTable"><thead><tr><th></th><th>Nama Produk</th><th>Kategori</th><th>Bahan</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
      </main>
      <div id="footer-admin-katalog"></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
