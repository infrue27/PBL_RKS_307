<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="register">

<section class="page active" id="page-register">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-side" style="background-image:url('https://images.unsplash.com/photo-1680965585463-386646047473?fm=jpg&amp;q=70&amp;w=900&amp;auto=format&amp;fit=crop')">
        <div class="auth-eyebrow">Ruang yang terasa seperti rumah</div>
        <h2>Mulai merangkai<br>rumah impian Anda.</h2>
        <p>Daftar sebentar saja, lalu jelajahi koleksi furnitur kayu kami.</p>
      </div>
      <div class="auth-form">
        <h2>Buat akun baru</h2>
        <p class="form-sub">Daftar dan temukan furnitur alami yang tepat untuk setiap ruang.</p>
        <div class="form-row">
          <label>Nama Lengkap</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><input type="text" id="regName" placeholder="Masukkan nama lengkap"></div>
        </div>
        <div class="form-row">
          <label>Email</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><input type="email" id="regEmail" placeholder="nama@email.com"></div>
        </div>
        <div class="form-row">
          <label>No. WhatsApp</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1z"/></svg><input type="text" id="regPhone" placeholder="Contoh: 0812 3456 7890"></div>
        </div>
        <div class="form-row">
          <label>Alamat</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><input type="text" id="regAddress" placeholder="Alamat pengiriman Anda"></div>
        </div>
        <div class="form-row">
          <label>Kata Sandi</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="regPass" placeholder="Minimal 8 karakter"></div>
        </div>
        <div class="form-row">
          <label>Konfirmasi Kata Sandi</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="regPassConfirm" placeholder="Ulangi kata sandi"></div>
        </div>
        <label class="check-row"><input type="checkbox" id="regTerms"> Saya menyetujui Syarat &amp; Ketentuan dan Kebijakan Privasi</label>
        <button class="btn btn-primary btn-block" onclick="doRegister()">Daftar</button>
        <p class="switch-link">Sudah punya akun? <a onclick="go('login')">Masuk</a></p>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
