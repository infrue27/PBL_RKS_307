<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="reset-password">

<section class="page active" id="page-reset-password">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-side" style="background-image:url('https://images.unsplash.com/photo-1680965585463-386646047473?fm=jpg&amp;q=70&amp;w=900&amp;auto=format&amp;fit=crop')">
        <div class="auth-eyebrow">Ruang yang terasa seperti rumah</div>
        <h2>Buat kata sandi baru.</h2>
        <p>Gunakan kata sandi yang kuat dan belum pernah Anda pakai di tempat lain.</p>
      </div>
      <div class="auth-form">
        <h2>Kata Sandi Baru</h2>
        <p class="form-sub">Minimal 8 karakter.</p>
        <div class="form-row">
          <label>Kata Sandi Baru</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="resetPass" placeholder="Minimal 8 karakter"></div>
        </div>
        <div class="form-row">
          <label>Konfirmasi Kata Sandi</label>
          <div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="resetPassConfirm" placeholder="Ulangi kata sandi baru"></div>
        </div>
        <button class="btn btn-primary btn-block" id="resetBtn" onclick="doResetPassword()">Simpan Kata Sandi</button>
        <p class="switch-link"><a onclick="go('login')">Kembali ke halaman masuk</a></p>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
