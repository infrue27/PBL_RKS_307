<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homey Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="kontak">

<section class="page active" id="page-kontak">
  <div class="container section" style="max-width:900px">
    <h2>Hubungi Kami</h2>
    <p style="text-align:center;color:var(--muted);font-size:13.5px;margin-top:-14px">Ada pertanyaan seputar produk atau pesanan? Isi form di bawah, tim kami akan menghubungi Anda kembali.</p>
    <div class="kontak-layout">
      <div class="card kontak-info">
        <h3 style="margin-top:0">Kontak Kami</h3>
        <div class="kinfo-row"><span>✉️</span><div><b>Email</b><br>anyeongg@homeywood.co.id</div></div>
        <div class="kinfo-row"><span>📞</span><div><b>Telepon</b><br>+62 21-555-890</div></div>
        <div class="kinfo-row"><span>🏭</span><div><b>Workshop</b><br>Batam, Kepulauan Riau</div></div>
        <div class="kinfo-row"><span>🏬</span><div><b>Showroom</b><br>Batu Aji, Batam</div></div>
      </div>
      <div class="card">
        <div class="form-row"><label>Nama Lengkap</label><input type="text" id="kNama" placeholder="Nama lengkap Anda"></div>
        <div class="form-row"><label>Email</label><input type="email" id="kEmail" placeholder="nama@email.com"></div>
        <div class="form-row"><label>Alasan Menghubungi</label>
          <textarea id="kAlasan" rows="4" placeholder="Ceritakan kebutuhan Anda..."></textarea>
        </div>
        <div class="form-row"><label>No. WhatsApp</label><input type="text" id="kWa" placeholder="08xxxxxxxxxx"></div>
        <button class="btn btn-primary btn-block" onclick="submitKontak()">Kirim Pesan</button>
      </div>
    </div>
  </div>
  <div id="footer-kontak"></div>
</section>

<div class="toast" id="toast"></div>

<script src="../js/app.js"></script>
</body>
</html>
