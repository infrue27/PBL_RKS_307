# Upstream = service "web" di jaringan docker (port 80 di dalam container)
upstream homeywood_app {
    server web:80;
}

# Port 80 -> redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name homeywood.web.id www.homeywood.web.id _;

    # (opsional) tantangan Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 -> reverse proxy ke website
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name homeywood.web.id www.homeywood.web.id _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Aplikasi membatasi upload 4 MB; beri sedikit ruang untuk overhead multipart
    client_max_body_size 5m;

    # REVISI: Tambahan Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://homeywood_app;
        proxy_http_version 1.1;

        # Header ini dibaca ProxyFix di Flask (x_for, x_proto, x_host = 1)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}